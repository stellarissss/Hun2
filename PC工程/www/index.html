<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>混在日本</title>

<style>
    html, body {
        margin: 0; padding: 0; border: 0;
        width: 100%; height: 100%;
        background: #000; overflow: hidden;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    * { box-sizing: border-box; }

    /* 竖屏舞台：保持 9:16 比例，居中显示，两侧留黑 */
    #stage {
        position: absolute; top: 0; left: 50%;
        transform: translateX(-50%);
        height: 100%; aspect-ratio: 9 / 16;
        max-width: 100%;
        background: #000; overflow: hidden;
    }
    #stage iframe {
        width: 100%; height: 100%; border: 0; display: block;
        background: #000;
    }

    /* 启动遮罩 */
    #boot {
        position: fixed; inset: 0; z-index: 9999;
        background: #000; color: #b8a07a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-size: 15px; letter-spacing: 2px;
        transition: opacity .6s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .logo {
        font-size: 76px; font-weight: 700; color: #d8c9a8;
        letter-spacing: 8px; margin-bottom: 28px;
        text-shadow: 0 0 24px rgba(216,201,168,.35);
    }
    #boot .bar {
        width: 240px; height: 3px; background: #1e1c18;
        border-radius: 2px; overflow: hidden; margin-top: 16px;
    }
    #boot .bar i {
        display: block; height: 100%; width: 0%;
        background: linear-gradient(90deg, #7a6a4a, #d8c9a8);
        transition: width .3s ease;
    }
    #boot .tip { margin-top: 14px; font-size: 12px; color: #6a6152; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="stage">
    <!--
        启动参数说明（原版页面要求 openid 与 channel 非空，否则跳转外部域名）：
          openid        —— 本地固定标识，单机版无需真实账号
          channel       —— 固定 pc，触发 PC 分支与 HD 图集
          epv           —— 资料片版本 jp（日本版）
          mk            —— 渠道标识 windows
          app_version   —— 版本号
          app_lg        —— 语言 zh
          fdomain       —— 父页面域名，用于启动文本回传
    -->
    <iframe id="game"
            src="game_main_offline.html?openid=local_player&amp;channel=pc&amp;epv=jp&amp;mk=windows&amp;app_version=4&amp;app_lg=zh"
            allow="autoplay; fullscreen" scrolling="no" frameborder="0"></iframe>
</div>

<div id="boot">
    <div class="logo">混</div>
    <div>在 日 本</div>
    <div class="bar"><i id="bootbar"></i></div>
    <div class="tip" id="boottip">正在载入游戏资源…</div>
</div>

<script src="offline/shell.js"></script>
</body>
</html>
