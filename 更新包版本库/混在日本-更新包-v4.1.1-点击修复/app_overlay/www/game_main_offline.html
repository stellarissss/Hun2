		//向Body中添加Javascript标签
		function addInBody_Javascript(src) {
			var secScript = document.createElement("script");

			secScript.setAttribute("src", src);
			document.head.insertBefore(secScript, document.head.lastChild);

		//得到页面参数
		function getPageParamValue(name) {
			var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
			var r = window.location.search.substr(1).match(reg);
			if (r != null) return unescape(r[2]);
			return null;
		}

		//随机数
		function RandomNumBoth_HTML(Min,Max){
			if(Max<Min){
				var temp=Max;
				Max=Min;
				Min=temp;
			}
			// var Range = Max - Min;
			// var Rand = Math.randopm();
			// var num = Min + Math.round(Rand * Range); //四舍五入
			// return parseInt(num);
			return Math.floor(Math.random() * (Max - Min + 1) + Min);
		}

		//得到系统语言
		function getLanguageSystem() {
			var backLanguage=LANGUAGE_ZH;
			//Android
			if(channel==CHANNEL_ANDROID)
			{
				//如果是中文
				if(app_lg=="zh")
				{
					//如果是简体
					if(lg_sc=="Hans")
					{
						backLanguage=LANGUAGE_ZH;
					}
					//如果是繁体
					else if(lg_sc=="Hant")
					{
						backLanguage=LANGUAGE_ZH_FAN;
					}
				}
				//如果是英文
				else if(app_lg=="en")
				{
					backLanguage=LANGUAGE_EN;
				}
				//其他情况
				else{
					//如果是美国版本，那么英文
					if(pkname==PK_NAME_VERSION_USA) {
						backLanguage=LANGUAGE_EN
					}
					//如果是中国版本，那么中文
					else{
						backLanguage=LANGUAGE_ZH
					}
				}
			}
			//iOS
			else if(channel==CHANNEL_IOS)
			{
				//中文简体
				if(app_lg.startsWith("zh-Hans"))
				{
					backLanguage=LANGUAGE_ZH;
				}
				//简体粤语
				if(app_lg.startsWith("yue-Hans"))
				{
					backLanguage=LANGUAGE_ZH;
				}
				//上海
				if(app_lg.startsWith("wuu"))
				{
					backLanguage=LANGUAGE_ZH;
				}
				//中文繁体（台湾、香港、澳门，新加坡）
				else if(app_lg.startsWith("zh-Hant"))
				{
					backLanguage=LANGUAGE_ZH_FAN;
				}
				//其他中文
				else if(app_lg.startsWith("zh")){
					backLanguage=LANGUAGE_ZH;
				}
				//英文
				else if(app_lg.startsWith("en"))
				{
					backLanguage=LANGUAGE_EN;
				}
				//日文
				else if(app_lg.startsWith("ja"))
				{
					backLanguage=LANGUAGE_JA;
				}
				//其他情况
				else{
					backLanguage=LANGUAGE_EN
				}
			}
			return backLanguage;
		}

	function requestUserProgress() {
		qloudCos = new COS({
			getAuthorization: function (options, callback) {
				// 异步获取临时密钥
				$.get(baseURL+'/h2/qcloud_temp_credential.do', {
					openid: openid,
					channel: channel,
					uid:userBaseInfo.id,
					cache:new Date().getMilliseconds()+"_"+new Date().getMinutes()
				}, function (backData) {
					var data= JSON.parse(backData);
					var credentials =data.credentials;
					callback({
						TmpSecretId: credentials.tmpSecretId,
						TmpSecretKey: credentials.tmpSecretKey,
						XCosSecurityToken: credentials.sessionToken,
						ExpiredTime: data.expiredTime
					});
				});
			}
		});


		var fileKey=getQloudCos_PrefixPath("progress/")+userBaseInfo.id+'.txt';
		qloudCos.getObject({
			Bucket: QCLOUD_BUCKET,
			Region: QCLOUD_REGION,
			ResponseExpires:""+RandomNumBoth_HTML(0,10)+"",
			ResponseCacheControl:""+RandomNumBoth_HTML(-99999999,10)+"",
			Key: fileKey,
		}, function(err, data) {
			// console.log(err || data.Body);
			userBaseInfo.progressObject=null;

			// alert("cos data:"+data);

			//如果报错了
			if(err!=null)
			{
				//如果新用户没有进度,那么属于正常
				if(err.statusCode!=null && err.statusCode==404)
				{
					hasProgressLoadError=false;
				}
				//其他错误，那么不正常
				else {
					hasProgressLoadError=true;
				}
			}
			//如果有进度数据
			else if(data!=null)
			{
				var resultProgress=data.Body;
				//游戏进度
				if(resultProgress!=null && resultProgress!="" && resultProgress!="NONE"){
					try {
						//解压进度数据
						var unzip=unzip_sh(resultProgress);
						//解码数据
						// var decodeString=decodeURIComponent(unzip,"UTF-8")
						//给用户进度数据赋值
						userBaseInfo.progressObject=JSON.parse(unzip);
					}
					catch(err){
						userBaseInfo.loadError=resultProgress;
						hasProgressLoadError=true;
					}
				}
			}

			// hasProgressLoadError=true;

			//初始化游戏
			initGame();
		});
	}

			success:function(result){ //请求成功的回调函数
				if(result.userBaseInfo!=null){
					//用户基本信息
					userBaseInfo=result.userBaseInfo;
					userBaseInfo.currentTimeMillis_server=parseInt(result.currentTimeMillis_server);
					userBaseInfo.currentTimeMillis_local=parseInt(new Date().getTime());
					QCLOUD_BUCKET=result.QCLOUD_BUCKET;
					QCLOUD_REGION=result.QCLOUD_REGION;

					//载入游戏进度
					requestUserProgress();
				}
			},
			//请求完成后最终执行参数
			complete : function(XMLHttpRequest,status){
				//超时,status还有success,error等值的情况
				if(status=='timeout'){
					//重新加载整个页面
					window.location.href=location.href;
				}
			}
		});
	}


	/**
	 *  加载完成JS依赖
	 **/
	function loadJsFinish() {
		requestUserInfo();
	}

	function initGame() {
		//hun2.jsp停止显示loading
		stopShowLoading_RemoveDom();

		//移除APP闪屏
		// alert("移除闪屏");

		//如果是正式版本，那么移除闪屏
		if(!hasReviewVersion)
		{
			call_removeSplash();
		}

		//有可能是子页面，父页面移除载入Masking
		fatherPage_CloseMaskLoading();

		// alert("channel="+CHANNEL_ANDROID+";app_version="+app_version);
		//安卓机器重新设置baseURL
		callAndroid_base_url(baseURL);

		// alert("2初始用户的channel="+channel);
		domainRoot = baseURL;
		mainManager = new MainManager();
		mainManager.init();

		threadLoop(50);

		//初始化输入框CSS
		initInputBaseCSS();

		//如果是微信小程序
		if (channel == "wechat_app") {
			//alert("准备向外部加载成功消息");
			//wx.miniProgram.postMessage({ data: 'foo' });
			//wx.miniProgram.postMessage({ data: {share_revive_token: '1190'} });
			//alert("向外部加载成功消息,完毕");

			document.title = "混二";
		}
		//非小程序
		else {
			document.title = "混二";
		}

		/**
		 * to do
		 * 》页面一加载就给后台发送，说页面需要重新加载。
		 * 》页面MainManager初始化加载完成就给后台发送不需要刷新页面。
		 * 》微信小程序页面onHide时做好标识，为再次onShow判断刷新做好准备
		 * 》微信小程序页面再次onShow的时候，判断是否之前后过onHide，如果onHide过,那么向后台请求得到是否需要刷新页面。
		 */
		// 检测网页是否切换到后台
		document.addEventListener("visibilitychange", function () {
			// document.title = document.hidden ? "用户离开了" : "用户回来了";
			// mainManager.startMenuManager.addNoticeSimple("我来了");

			//如果隐藏了，那么关闭BGM
			if (document.hidden) {
				//切到后台
				hasAppInScreenFront=false;

				// showAlert("检测网页是否切换到后台");
				if (mainManager.loadResManager != null) {
					mainManager.loadResManager.pauseBGM();

					//如果在游戏中，并且不是job那么保存进度
					if(mainManager.getScene()===SCENE_PLAY &&
							mainManager.playManager.cityManager.curCity!=null &&
							!mainManager.playManager.cityManager.curCity.hasInJob())
					{
						// showAlert("保存游戏了");
						//给支付预留60秒
						if(getCurrentSecond()-LAST_PAY_TIME_SECOND>60)
						{
							// showAlert("检测网页是否切换到后台:保存进度");
							mainManager.progressManager.saveProgress(true,false,false);
						}
						else{
							// showAlert("检测网页是否切换到后台:由于支付，不保存进度");
						}
					}
				}
			}
			else {
				//切到前台
				hasAppInScreenFront=true;

				if (mainManager.loadResManager != null) {
					mainManager.appBackToFront();
					// mainManager.loadResManager.resumeBGM();
					// mainManager.loadResManager.playAudioMainBMG();
					// mainManager.reloadHunCoinUI();

				}
			}
		});
	}

	// 兼容性处理
	window.requestAnimFrame = (function() {
		return (
				window.requestAnimationFrame ||
				window.webkitRequestAnimationFrame ||
				window.mozRequestAnimationFrame ||
				window.oRequestAnimationFrame ||
				window.msRequestAnimationFrame ||
				function(callback, element) {
					window.setTimeout(callback, 50)
				}
		)
	})();

	function threadLoop(time) {
		requestAnimationFrame(
				function(){
					mainManager.gameLoop();
				}
		);
		// setTimeout(function () {
		// 	mainManager.gameLoop();
		// }, 50);
	}

//eleInputBase.style.backgroundColor="#FFFFFF";
